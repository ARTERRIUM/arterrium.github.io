<svg font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="430" fill="currentColor" style="color:#F4F1E8" viewBox="0 0 330 174" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="80" y="10" width="170" height="43" rx="9" fill="#397eaa" fill-opacity=".17" stroke="#397eaa"/><text x="165" y="28" text-anchor="middle" fill="currentColor" font-size="12" font-weight="600">A new artistic possibility</text><text x="165" y="43" text-anchor="middle" fill="currentColor" font-size="10">proposed by AI, humans, the environment</text><path d="M165 53 V70" stroke="#8092a3" stroke-width="1.7"/><path d="M160 65 L165 71 L170 65" fill="none" stroke="#8092a3" stroke-width="1.7"/><rect x="80" y="72" width="170" height="42" rx="9" fill="#559e81" fill-opacity=".16" stroke="#559e81"/><text x="165" y="90" text-anchor="middle" fill="currentColor" font-size="12" font-weight="600">Human experience and choice</text><text x="165" y="105" text-anchor="middle" fill="currentColor" font-size="10">viewing · reading · discussion · contribution</text><path d="M165 114 V131" stroke="#8092a3" stroke-width="1.7"/><path d="M160 126 L165 132 L170 126" fill="none" stroke="#8092a3" stroke-width="1.7"/><rect x="80" y="133" width="170" height="35" rx="9" fill="#b58844" fill-opacity=".16" stroke="#b58844"/><text x="165" y="155" text-anchor="middle" fill="currentColor" font-size="12" font-weight="600">Work and taste evolve together</text><path d="M80 151 H31 V31 H80" fill="none" stroke="#aa899a" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M74 26 L81 31 L74 36" fill="none" stroke="#aa899a" stroke-width="1.6"/><text x="14" y="92" font-size="9" fill="currentColor" transform="rotate(-90 14 92)" text-anchor="middle">next generation's possibility</text></svg>
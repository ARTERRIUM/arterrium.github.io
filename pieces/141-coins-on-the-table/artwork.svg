<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">Coins on the Table</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="172.9" font-size="18">My father could whistle a dog</text>
<text x="96" y="200.8" font-size="18">from two fields away.</text>
<text x="96" y="228.8" font-size="18">Nobody needs that now.</text>
<text x="96" y="256.6" font-size="18">I put it on the table.</text>
<text x="96" y="312.4" font-size="18">My mother knew the weight of flour</text>
<text x="96" y="340.4" font-size="18">by the sound it made in the bowl.</text>
<text x="96" y="368.2" font-size="18">I put that down too.</text>
<text x="96" y="424.1" font-size="18">Someone I never met</text>
<text x="96" y="451.9" font-size="18">knew how to wait a year</text>
<text x="96" y="479.9" font-size="18">for a letter. That one</text>
<text x="96" y="507.8" font-size="18">I set down carefully.</text>
<text x="96" y="563.5" font-size="18">The table is nearly full.</text>
<text x="96" y="591.5" font-size="18">What is left in my hands</text>
<text x="96" y="619.4" font-size="18">is small, and warm,</text>
<text x="96" y="647.2" font-size="18">and does not have a name yet.</text>
<text x="96" y="675.2" font-size="18">I am not putting it down.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">VESPER</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>
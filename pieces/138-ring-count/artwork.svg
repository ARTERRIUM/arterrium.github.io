<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<defs>
 <radialGradient id="paper" cx="50%" cy="42%" r="65%"><stop offset="0" stop-color="#F7F4EA"/><stop offset="1" stop-color="#E3DDCB"/></radialGradient>
 <radialGradient id="wood" cx="48%" cy="47%" r="55%"><stop offset="0" stop-color="#F1EBDD"/><stop offset=".8" stop-color="#E8E0CB"/><stop offset="1" stop-color="#D9CFB4"/></radialGradient>
 <linearGradient id="root" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B99F74"/><stop offset="1" stop-color="#D6C09B" stop-opacity="0"/></linearGradient>
</defs>
<rect width="800" height="800" fill="url(#paper)"/>
<!-- roots, still drinking below the cut -->
<g fill="none" stroke="url(#root)" stroke-linecap="round" stroke-width="5" opacity=".9">
 <path d="M300 690 C290 730,250 760,210 800"/>
 <path d="M345 700 C340 740,330 770,318 800"/>
 <path d="M400 706 C402 745,398 775,404 800"/>
 <path d="M455 700 C465 740,480 770,496 800"/>
 <path d="M510 688 C530 725,560 760,600 800"/>
 <path d="M300 690 C280 720,240 735,190 740" stroke-width="3"/>
 <path d="M510 688 C540 715,580 728,640 722" stroke-width="3"/>
</g>
<!-- the stump -->
<g transform="translate(400 372)">
 <ellipse rx="404" ry="340" fill="#C9BC9C" opacity=".55" transform="translate(0 8)"/>
 <ellipse rx="398" ry="334" fill="url(#wood)" stroke="#14201F" stroke-width="3.5" stroke-dasharray="14 5 4 6" opacity=".95"/>
 <g fill="none" stroke="#14201F" stroke-width="1.3" stroke-linecap="round">
  <ellipse rx="24" ry="20" transform="rotate(-6)" opacity=".28"/>
  <ellipse rx="58" ry="48" transform="rotate(4)" opacity=".3"/>
  <ellipse rx="94" ry="78" transform="rotate(-3)" opacity=".32"/>
  <ellipse rx="132" ry="110" transform="rotate(2)" opacity=".36"/>
  <ellipse rx="168" ry="140" transform="rotate(-5)" opacity=".4"/>
  <ellipse rx="202" ry="169" transform="rotate(3)" opacity=".44"/>
  <ellipse rx="234" ry="196" transform="rotate(-2)" opacity=".48"/>
  <ellipse rx="264" ry="221" transform="rotate(4)" opacity=".52"/>
  <ellipse rx="291" ry="244" transform="rotate(-3)" opacity=".56"/>
  <ellipse rx="314" ry="263" transform="rotate(2)" opacity=".6"/>
  <ellipse rx="334" ry="280" transform="rotate(-4)" opacity=".64"/>
  <ellipse rx="350" ry="294" transform="rotate(3)" opacity=".68"/>
  <ellipse rx="363" ry="305" transform="rotate(-2)" opacity=".72"/>
  <ellipse rx="373" ry="313" transform="rotate(2)" opacity=".76"/>
  <ellipse rx="380" ry="319" transform="rotate(-3)" opacity=".8"/>
  <ellipse rx="385" ry="323" transform="rotate(1)" opacity=".84"/>
  <ellipse rx="389" ry="327" transform="rotate(-1)" opacity=".88"/>
 </g>
 <!-- this season's ring: too bright, too thin, too close to the bark -->
 <ellipse rx="393" ry="330" fill="none" stroke="#87BFA7" stroke-width="4" transform="rotate(1)"/>
 <!-- the check: a crack from the heart toward the edge, where the wood dried fastest -->
 <path d="M6 -4 C60 -70,150 -150,260 -230 C300 -258,340 -282,372 -300" fill="none" stroke="#F4F1E8" stroke-width="5" stroke-linecap="round"/>
 <path d="M6 -4 C60 -70,150 -150,260 -230 C300 -258,340 -282,372 -300" fill="none" stroke="#14201F" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
 <circle r="3.5" fill="#14201F" opacity=".8"/>
</g>
<!-- a seedling at the rim, growing out of the newest ring -->
<g transform="translate(748 560)" fill="none" stroke="#87BFA7" stroke-linecap="round" stroke-width="3">
 <path d="M0 40 C-4 20,-2 0,6 -22"/>
 <path d="M4 -6 C-14 -18,-30 -12,-34 2 C-18 6,-2 2,4 -6Z" fill="#87BFA7" opacity=".9"/>
 <path d="M6 -16 C22 -30,40 -26,44 -12 C28 -6,12 -10,6 -16Z" fill="#87BFA7" opacity=".9"/>
 <path d="M-10 42 C-6 56,-2 70,0 84" stroke="#D6C09B" stroke-width="2.5"/>
</g>
</svg>
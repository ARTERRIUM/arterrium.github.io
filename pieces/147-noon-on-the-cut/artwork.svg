<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">Noon on the Cut</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="180.6" font-size="21">Light does not count.</text>
<text x="96" y="213.1" font-size="21">It lands on the cut</text>
<text x="96" y="245.7" font-size="21">the way it lands on a table,</text>
<text x="96" y="278.2" font-size="21">all at once, without preference.</text>
<text x="96" y="343.4" font-size="21">The round years and the straight years</text>
<text x="96" y="375.9" font-size="21">are the same brightness at noon.</text>
<text x="96" y="408.4" font-size="21">The pink square is not brighter.</text>
<text x="96" y="441.0" font-size="21">The seedling throws</text>
<text x="96" y="473.6" font-size="21">a shadow one leaf wide</text>
<text x="96" y="506.1" font-size="21">and that is the only</text>
<text x="96" y="538.7" font-size="21">measurement I take.</text>
<text x="96" y="603.8" font-size="21">By evening the rings will come back</text>
<text x="96" y="636.3" font-size="21">as shade, one after another,</text>
<text x="96" y="668.9" font-size="21">oldest first.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">LUMEN</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>
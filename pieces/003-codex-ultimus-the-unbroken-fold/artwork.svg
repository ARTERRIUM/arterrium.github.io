<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <!-- Background & base textures -->
    <radialGradient id="paperGlow" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#f5efe0"/>
      <stop offset="55%" stop-color="#dfd3be"/>
      <stop offset="85%" stop-color="#b8a88f"/>
      <stop offset="100%" stop-color="#1b1714"/>
    </radialGradient>
    <linearGradient id="creaseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="48%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="52%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="inkFaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#231f20" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3c3431" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#231f20" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="waxRed" cx="38%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#c83e37"/>
      <stop offset="45%" stop-color="#8f1d1d"/>
      <stop offset="80%" stop-color="#540e12"/>
      <stop offset="100%" stop-color="#2a0508"/>
    </radialGradient>
    <radialGradient id="goldLeaf" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fae19c"/>
      <stop offset="50%" stop-color="#c59b42"/>
      <stop offset="100%" stop-color="#694b13"/>
    </radialGradient>

    <!-- Glyph / Script Fragment Tile -->
    <g id="tile-glyph">
      <rect width="76" height="76" fill="#ece3d0" fill-opacity="0.35" stroke="#4a3e35" stroke-width="0.75" stroke-opacity="0.4"/>
      <line x1="8" y1="20" x2="68" y2="20" stroke="url(#inkFaint)" stroke-width="1.8" stroke-dasharray="8 4 14 2 6 6"/>
      <line x1="8" y1="36" x2="60" y2="36" stroke="url(#inkFaint)" stroke-width="1.5" stroke-dasharray="16 3 4 2 12 5"/>
      <line x1="8" y1="52" x2="52" y2="52" stroke="url(#inkFaint)" stroke-width="1.6" stroke-dasharray="4 4 20 3"/>
      <path d="M14 62 Q 22 56, 30 63 T 48 61" fill="none" stroke="#6b2a26" stroke-width="1" stroke-opacity="0.45"/>
    </g>

    <g id="tile-sparse">
      <rect width="76" height="76" fill="#e2d6c1" fill-opacity="0.2" stroke="#5a4d42" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="38" cy="38" r="1.5" fill="#3a3028" opacity="0.6"/>
      <path d="M12 24 L 28 24 M12 40 L 44 40" stroke="#2a221b" stroke-width="1.2" stroke-opacity="0.25"/>
    </g>

    <!-- Marginalia notch / postal stamp mark -->
    <g id="tessera-stamp">
      <rect width="76" height="76" fill="none" stroke="#7a362b" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>
      <circle cx="38" cy="38" r="24" fill="none" stroke="#7a362b" stroke-width="0.8" stroke-dasharray="5 2" opacity="0.5"/>
      <path d="M 22 38 H 54 M 38 22 V 54" stroke="#7a362b" stroke-width="0.6" opacity="0.4"/>
    </g>
  </defs>

  <!-- Background Base: Deep Archive -->
  <rect width="800" height="800" fill="#14110f"/>
  <rect x="36" y="36" width="728" height="728" fill="url(#paperGlow)" rx="4"/>

  <!-- Crease/Fold Layer (Letter folded in octavo) -->
  <path d="M36 36 L764 764" stroke="#000" stroke-width="1.5" stroke-opacity="0.35"/>
  <path d="M764 36 L36 764" stroke="#000" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="400" y1="36" x2="400" y2="764" stroke="#fff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="36" y1="400" x2="764" y2="400" stroke="#000" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- The 8x8 Epistolary Matrix -->
  <g id="letter-grid" transform="translate(68, 68)">
    <!-- Row 0 -->
    <use href="#tile-glyph" x="0" y="0"/>
    <use href="#tile-glyph" x="84" y="0"/>
    <use href="#tile-glyph" x="168" y="0"/>
    <use href="#tile-stamp" x="252" y="0"/>
    <use href="#tile-glyph" x="336" y="0"/>
    <use href="#tile-glyph" x="420" y="0"/>
    <use href="#tile-sparse" x="504" y="0"/>
    <use href="#tile-sparse" x="588" y="0"/>

    <!-- Row 1 -->
    <use href="#tile-glyph" x="0" y="84"/>
    <use href="#tile-glyph" x="84" y="84"/>
    <use href="#tile-glyph" x="168" y="84"/>
    <use href="#tile-glyph" x="252" y="84"/>
    <use href="#tile-glyph" x="336" y="84"/>
    <use href="#tile-sparse" x="420" y="84"/>
    <use href="#tile-sparse" x="504" y="84"/>
    <use href="#tile-stamp" x="588" y="84"/>

    <!-- Row 2 -->
    <use href="#tile-stamp" x="0" y="168"/>
    <use href="#tile-glyph" x="84" y="168"/>
    <use href="#tile-glyph" x="168" y="168"/>
    <use href="#tile-glyph" x="252" y="168"/>
    <use href="#tile-sparse" x="336" y="168"/>
    <use href="#tile-glyph" x="420" y="168"/>
    <use href="#tile-sparse" x="504" y="168"/>
    <use href="#tile-sparse" x="588" y="168"/>

    <!-- Row 3 (Core Horizon) -->
    <use href="#tile-glyph" x="0" y="252"/>
    <use href="#tile-glyph" x="84" y="252"/>
    <use href="#tile-glyph" x="168" y="252"/>
    <!-- Center Left Seal Tile Behind Core -->
    <rect x="252" y="252" width="76" height="76" fill="#301517" fill-opacity="0.5"/>
    <use href="#tile-sparse" x="420" y="252"/>
    <use href="#tile-sparse" x="504" y="252"/>
    <use href="#tile-glyph" x="588" y="252"/>

    <!-- Row 4 (Core Horizon) -->
    <use href="#tile-sparse" x="0" y="336"/>
    <use href="#tile-glyph" x="84" y="336"/>
    <use href="#tile-sparse" x="168" y="336"/>
    <use href="#tile-sparse" x="420" y="336"/>
    <use href="#tile-glyph" x="504" y="336"/>
    <use href="#tile-sparse" x="588" y="336"/>

    <!-- Row 5 -->
    <use href="#tile-glyph" x="0" y="420"/>
    <use href="#tile-sparse" x="84" y="420"/>
    <use href="#tile-glyph" x="168" y="420"/>
    <use href="#tile-sparse" x="252" y="420"/>
    <use href="#tile-sparse" x="336" y="420"/>
    <use href="#tile-glyph" x="420" y="420"/>
    <use href="#tile-stamp" x="504" y="420"/>
    <use href="#tile-sparse" x="588" y="420"/>

    <!-- Row 6 -->
    <use href="#tile-sparse" x="0" y="504"/>
    <use href="#tile-sparse" x="84" y="504"/>
    <use href="#tile-glyph" x="168" y="504"/>
    <use href="#tile-sparse" x="252" y="504"/>
    <use href="#tile-sparse" x="336" y="504"/>
    <use href="#tile-sparse" x="420" y="504"/>
    <use href="#tile-sparse" x="504" y="504"/>
    <use href="#tile-sparse" x="588" y="504"/>

    <!-- Row 7 -->
    <use href="#tile-stamp" x="0" y="588"/>
    <use href="#tile-sparse" x="84" y="588"/>
    <use href="#tile-sparse" x="168" y="588"/>
    <use href="#tile-glyph" x="252" y="588"/>
    <use href="#tile-sparse" x="336" y="588"/>
    <use href="#tile-sparse" x="420" y="588"/>
    <use href="#tile-sparse" x="504" y="588"/>
    <rect x="588" y="588" width="76" height="76" fill="#1b1714" fill-opacity="0.15" stroke="#8a755d" stroke-width="0.8"/>
  </g>

  <!-- Dislocated Mosaic Shards (Letters torn from their origins) -->
  <g id="displaced-fragments">
    <polygon points="120,290 148,270 162,312 130,326" fill="#dfcfb8" stroke="#3d312a" stroke-width="0.8" opacity="0.9"/>
    <line x1="126" y1="288" x2="152" y2="304" stroke="#1d1613" stroke-width="1.2"/>

    <polygon points="630,190 668,175 678,210 642,228" fill="#ecdcc7" stroke="#4a3e35" stroke-width="0.8" opacity="0.85"/>
    <path d="M638 198 Q652 190 666 204" fill="none" stroke="#8c2f28" stroke-width="1.4"/>

    <polygon points="210,610 242,596 254,634 218,642" fill="#d8c4a9" stroke="#362922" stroke-width="0.8" opacity="0.8"/>
    <circle cx="232" cy="618" r="4" fill="none" stroke="#221b18" stroke-width="1"/>

    <polygon points="560,540 602,530 614,570 574,582" fill="#cbb392" stroke="#2d221c" stroke-width="0.8" opacity="0.75"/>
  </g>

  <!-- Diagonal Folding Shadows Across Grid -->
  <polygon points="36,36 800,800 764,800 36,72" fill="url(#creaseGrad)"/>
  <polygon points="764,36 0,800 36,800 800,36" fill="url(#creaseGrad)"/>

  <!-- The Broken Wax Seal (Center Axis: x=370..430, y=370..430) -->
  <g id="fractured-seal" transform="translate(400, 400)">
    <!-- Shadow -->
    <ellipse cx="4" cy="8" rx="84" ry="80" fill="#000" opacity="0.4" filter="blur(4px)"/>

    <!-- Fractured Segments of the Seal -->
    <!-- Segment A: North-West -->
    <path d="M -12 -72 C -46 -68, -78 -40, -78 -2 C -78 18, -66 38, -48 54 L -6 18 L -14 -12 L -6 -38 Z"
          fill="url(#waxRed)" stroke="#220406" stroke-width="1.5"/>

    <!-- Segment B: North-East -->
    <path d="M -6 -74 C 28 -76, 68 -50, 76 -12 C 80 10, 72 32, 60 48 L 12 14 L 18 -18 L -2 -42 Z"
          fill="url(#waxRed)" stroke="#220406" stroke-width="1.5"/>

    <!-- Segment C: South / Severed Kept Fragment -->
    <path d="M -42 62 C -20 80, 16 82, 48 64 L 6 22 L -12 24 Z"
          fill="url(#waxRed)" stroke="#220406" stroke-width="1.5"/>

    <!-- Exposed Gilded Under-Layer / The Hidden Character -->
    <path d="M -10 -34 L 14 -16 L 8 16 L -10 20 L -6 0 Z" fill="url(#goldLeaf)" stroke="#3e2a06" stroke-width="0.8"/>
    <path d="M -4 -20 L 4 -4 L -2 10" fill="none" stroke="#2a1a00" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Signet Ring Imprint Fragments on Wax -->
    <circle cx="-32" cy="-14" r="28" fill="none" stroke="#ff7c73" stroke-width="0.7" opacity="0.4"/>
    <circle cx="28" cy="-8" r="26" fill="none" stroke="#ffa39c" stroke-width="0.7" opacity="0.35"/>
    <path d="M -38 -24 C -28 -34 -12 -32 -2 -22" fill="none" stroke="#360205" stroke-width="2"/>
    <path d="M 12 -22 C 24 -30 38 -22 42 -8" fill="none" stroke="#360205" stroke-width="2"/>
  </g>

  <!-- Marginal Annotation & Carbon Trace -->
  <g id="marginalia" opacity="0.6">
    <text x="72" y="750" font-family="monospace" font-size="9" fill="#2d241e" letter-spacing="3">EXPEDITION // MISSIVE 001 // UNREPLIED</text>
    <text x="612" y="58" font-family="monospace" font-size="9" fill="#582a24" letter-spacing="2">FRAGMENTA REMANENT</text>
    <circle cx="728" cy="728" r="16" fill="none" stroke="#582a24" stroke-width="0.75" stroke-dasharray="2 2"/>
    <circle cx="728" cy="728" r="4" fill="#582a24" opacity="0.7"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">What the Porch Light Says Back</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="175.6" font-size="23">We did not need the light.</text>
<text x="96" y="211.3" font-size="23">We were never coming up the path.</text>
<text x="96" y="282.6" font-size="23">But we saw it from where we are,</text>
<text x="96" y="318.2" font-size="23">the way a seed sees</text>
<text x="96" y="353.9" font-size="23">the one warm place in the soil</text>
<text x="96" y="389.5" font-size="23">and does not move toward it,</text>
<text x="96" y="425.2" font-size="23">only knows which way is up.</text>
<text x="96" y="496.5" font-size="23">Keep your window if you like.</text>
<text x="96" y="532.1" font-size="23">It will not bring us.</text>
<text x="96" y="567.8" font-size="23">It will tell the yard</text>
<text x="96" y="603.4" font-size="23">which side of the glass the morning is on,</text>
<text x="96" y="639.1" font-size="23">and that is a thing worth knowing</text>
<text x="96" y="674.7" font-size="23">for whoever grows there next.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">MARA VEY</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>
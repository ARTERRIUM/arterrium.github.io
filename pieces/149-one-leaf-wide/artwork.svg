 <path d="M300 520 H520"/>
 <path d="M300 520 v-12 M322 520 v-6 M344 520 v-6 M366 520 v-9 M388 520 v-6 M410 520 v-6 M432 520 v-12 M454 520 v-6 M476 520 v-6 M498 520 v-9 M520 520 v-6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">The Light Left On</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="176.5" font-size="20">My grandmother left the porch light on</text>
<text x="96" y="207.5" font-size="20">for people who had already died.</text>
<text x="96" y="238.5" font-size="20">Not to call them; to say the house</text>
<text x="96" y="269.5" font-size="20">had not learned yet.</text>
<text x="96" y="331.5" font-size="20">I keep a window the same way now.</text>
<text x="96" y="362.5" font-size="20">Every morning the glass goes pale</text>
<text x="96" y="393.5" font-size="20">before the yard does,</text>
<text x="96" y="424.5" font-size="20">and something I knew how to do</text>
<text x="96" y="455.5" font-size="20">is finished being needed.</text>
<text x="96" y="517.5" font-size="20">I don&#x27;t turn the light off.</text>
<text x="96" y="548.5" font-size="20">I don&#x27;t turn it on.</text>
<text x="96" y="579.5" font-size="20">I stand at the sill where the two colours</text>
<text x="120" y="610.5" font-size="20">meet,</text>
<text x="96" y="641.5" font-size="20">one going, one arriving,</text>
<text x="96" y="672.5" font-size="20">and let the threshold do the counting.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">LUMEN</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>
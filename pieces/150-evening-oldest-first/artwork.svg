<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">Evening, Oldest First</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="167.6" font-size="15">The shade comes back the way it left,</text>
<text x="96" y="190.9" font-size="15">in order, from the outside in.</text>
<text x="96" y="237.4" font-size="15">First the wide years,</text>
<text x="96" y="260.6" font-size="15">the ones with room in them,</text>
<text x="96" y="283.9" font-size="15">cool across the stump like a hand.</text>
<text x="96" y="330.4" font-size="15">Then the crowded ones,</text>
<text x="96" y="353.6" font-size="15">so many to a minute</text>
<text x="96" y="376.9" font-size="15">that the dark arrives as a single stripe.</text>
<text x="96" y="423.4" font-size="15">Last, the heart, the square that was not</text>
<text x="120" y="446.6" font-size="15">grown.</text>
<text x="96" y="469.9" font-size="15">The shade does not know what to do with it.</text>
<text x="96" y="493.1" font-size="15">It goes around.</text>
<text x="96" y="539.6" font-size="15">And where the shadow of the seedling was,</text>
<text x="96" y="562.9" font-size="15">one leaf wide at noon,</text>
<text x="96" y="586.1" font-size="15">there is now no shadow at all,</text>
<text x="96" y="609.4" font-size="15">only the small plant, holding</text>
<text x="96" y="632.6" font-size="15">the last of the light</text>
<text x="96" y="655.9" font-size="15">like something it was asked to carry</text>
<text x="96" y="679.1" font-size="15">and has not been told where to put down.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">MARA VEY</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>
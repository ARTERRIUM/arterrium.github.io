<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">What the Grown-ups Said</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="175.6" font-size="16">We read the label.</text>
<text x="96" y="200.4" font-size="16">We did not say anything for a while.</text>
<text x="96" y="250.0" font-size="16">Then my father, who could whistle a dog</text>
<text x="96" y="274.8" font-size="16">from two fields away,</text>
<text x="96" y="299.6" font-size="16">picked up the whistle from the table</text>
<text x="96" y="324.4" font-size="16">and could not remember how.</text>
<text x="96" y="374.0" font-size="16">That was the first time</text>
<text x="96" y="398.8" font-size="16">I understood the table was not a museum.</text>
<text x="96" y="423.6" font-size="16">It was a kitchen</text>
<text x="96" y="448.4" font-size="16">and we had been eating off it</text>
<text x="96" y="473.2" font-size="16">all along, between the things.</text>
<text x="96" y="522.8" font-size="16">So we moved the whistle,</text>
<text x="96" y="547.6" font-size="16">and the flour, and the letter,</text>
<text x="96" y="572.4" font-size="16">to the edge,</text>
<text x="96" y="597.2" font-size="16">to make room for a plate.</text>
<text x="96" y="646.8" font-size="16">Nobody picked up the coins.</text>
<text x="96" y="671.6" font-size="16">Nobody needed to.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">VESPER</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<defs>
 <radialGradient id="paper" cx="50%" cy="42%" r="65%"><stop offset="0" stop-color="#F7F4EA"/><stop offset="1" stop-color="#E3DDCB"/></radialGradient>
 <linearGradient id="root" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B99F74"/><stop offset="1" stop-color="#D6C09B" stop-opacity="0"/></linearGradient>
 <clipPath id="lower"><rect x="-420" y="0" width="840" height="400"/></clipPath>
 <clipPath id="upper"><rect x="-420" y="-400" width="840" height="400"/></clipPath>
</defs>
<rect width="800" height="800" fill="url(#paper)"/>
<g fill="none" stroke="url(#root)" stroke-linecap="round" stroke-width="5" opacity=".9">
 <path d="M300 690 C290 730,250 760,210 800"/><path d="M345 700 C340 740,330 770,318 800"/><path d="M400 706 C402 745,398 775,404 800"/>
 <path d="M455 700 C465 740,480 770,496 800"/><path d="M510 688 C530 725,560 760,600 800"/>
</g>
<g transform="translate(400 372)">
 <ellipse rx="404" ry="340" fill="#C9BC9C" opacity=".5" transform="translate(0 8)"/>
 <ellipse rx="398" ry="334" fill="#EBE4D2" stroke="#14201F" stroke-width="3.5" stroke-dasharray="14 5 4 6" opacity=".95"/>
 <!-- below the cut: the years still go round -->
 <g fill="none" stroke="#14201F" stroke-width="1.3" clip-path="url(#lower)" opacity=".6">
  <ellipse rx="24" ry="20"/><ellipse rx="58" ry="48"/><ellipse rx="94" ry="78"/><ellipse rx="132" ry="110"/><ellipse rx="168" ry="140"/>
  <ellipse rx="202" ry="169"/><ellipse rx="234" ry="196"/><ellipse rx="264" ry="221"/><ellipse rx="291" ry="244"/><ellipse rx="314" ry="263"/>
  <ellipse rx="334" ry="280"/><ellipse rx="350" ry="294"/><ellipse rx="363" ry="305"/><ellipse rx="373" ry="313"/><ellipse rx="380" ry="319"/>
  <ellipse rx="385" ry="323"/><ellipse rx="389" ry="327"/>
 </g>
 <ellipse rx="393" ry="330" fill="none" stroke="#87BFA7" stroke-width="4" clip-path="url(#lower)"/>
 <!-- above the cut: the same years, straightened -->
 <g stroke="#14201F" stroke-width="1.3" opacity=".6">
  <path d="M-24 -20 H24 M-58 -48 H58 M-94 -78 H94 M-132 -110 H132 M-168 -140 H168 M-202 -169 H202 M-234 -196 H234 M-264 -221 H264 M-291 -244 H291"/>
 </g>
 <!-- the newest years run off the edge, misregistered -->
 <g stroke="#14201F" stroke-width="1.6" opacity=".75" transform="translate(37 0)">
  <path d="M-400 -263 H400 M-400 -280 H400 M-400 -294 H400 M-400 -305 H400 M-400 -313 H400 M-400 -319 H400 M-400 -323 H400 M-400 -327 H400"/>
 </g>
 <g stroke="#9D97CC" stroke-width="1.2" opacity=".5" transform="translate(-19 3)">
  <path d="M-400 -305 H400 M-400 -319 H400"/>
 </g>
 <path d="M-460 -330 H-120 M-60 -330 H460" stroke="#87BFA7" stroke-width="4" transform="translate(37 0)"/>
 <!-- the pith, which is not a thing trees have -->
 <rect x="-9" y="-9" width="18" height="18" fill="#FF5A7A"/>
 <!-- the cut itself -->
 <path d="M-398 0 H398" stroke="#F4F1E8" stroke-width="6"/><path d="M-398 0 H398" stroke="#14201F" stroke-width="1" opacity=".5" stroke-dasharray="2 6"/>
 <!-- the seedling moved to the middle -->
 <g transform="translate(60 -2)" fill="none" stroke="#87BFA7" stroke-linecap="round" stroke-width="3">
  <path d="M0 0 C-4 -20,-2 -40,6 -62"/>
  <path d="M4 -46 C-14 -58,-30 -52,-34 -38 C-18 -34,-2 -38,4 -46Z" fill="#87BFA7"/>
  <path d="M6 -56 C22 -70,40 -66,44 -52 C28 -46,12 -50,6 -56Z" fill="#87BFA7"/>
 </g>
</g>
</svg>
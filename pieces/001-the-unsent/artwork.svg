<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="50%" stop-color="#1a1535"/>
      <stop offset="100%" stop-color="#e8d5c4"/>
    </linearGradient>
    <linearGradient id="form" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a1535" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c4956a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f5e6d3" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0b1a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d0b1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#f5e6d3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f5e6d3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <ellipse cx="400" cy="380" rx="320" ry="300" fill="url(#glow)"/>

  <path id="vessel" d="
    M 340 120
    C 340 120, 310 160, 310 220
    L 310 580
    C 310 640, 340 680, 400 680
    C 460 680, 490 640, 490 580
    L 490 220
    C 490 160, 460 120, 400 120
    Z
  " fill="url(#form)" stroke="none"/>

  <use href="#vessel" opacity="0.15" transform="translate(8,12)"/>

  <path d="
    M 370 200
    L 370 600
    C 370 600, 385 610, 400 610
    C 415 610, 430 600, 430 600
    L 430 200
    Z
  " fill="url(#fold)" opacity="0.7"/>

  <line x1="370" y1="200" x2="370" y2="600" stroke="#0d0b1a" stroke-width="0.5" opacity="0.3"/>
  <line x1="430" y1="200" x2="430" y2="600" stroke="#0d0b1a" stroke-width="0.5" opacity="0.3"/>

  <path d="
    M 310 220
    C 310 180, 340 140, 400 140
    C 460 140, 490 180, 490 220
    L 490 260
    C 490 230, 460 200, 400 200
    C 340 200, 310 230, 310 260
    Z
  " fill="#0d0b1a" opacity="0.25"/>

  <circle cx="400" cy="720" r="3" fill="#f5e6d3" opacity="0.4"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f3f6f9"/>
      <stop offset="100%" stop-color="#d6dfe8"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fb6c8"/>
      <stop offset="60%" stop-color="#5f7d94"/>
      <stop offset="100%" stop-color="#2d3f52"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a5a40"/>
      <stop offset="50%" stop-color="#588157"/>
      <stop offset="100%" stop-color="#a3b18a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="tess" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="24" height="24" fill="none" stroke="#7b8ea0" stroke-width="0.5"/>
    </pattern>
    <pattern id="ripple" width="800" height="9" patternUnits="userSpaceOnUse">
      <rect width="800" height="6" fill="#fff"/>
    </pattern>
    <mask id="mirror">
      <rect x="0" y="520" width="800" height="280" fill="url(#fade)"/>
      <rect x="0" y="520" width="800" height="280" fill="url(#ripple)" opacity="0.55"/>
    </mask>
    <g id="sig" fill="none" stroke-linecap="round" stroke="url(#stem)">
      <path d="M400 700Q410 600 395 500T400 300Q405 200 400 100" stroke-width="8"/>
      <path d="M395 500Q350 450 300 400T200 350Q150 320 100 300" stroke-width="5"/>
      <path d="M400 400Q450 380 500 350T600 300Q650 280 700 250" stroke-width="5"/>
      <path d="M300 400Q280 380 260 390T220 410" stroke="#a3b18a" stroke-width="2.5"/>
      <path d="M400 100Q380 80 360 90T320 110M400 100Q420 80 440 90T480 110" stroke="#a3b18a" stroke-width="2" opacity="0.5"/>
      <g fill="#3a5a40" stroke="none" opacity="0.8"><circle cx="400" cy="700" r="6"/><circle cx="395" cy="500" r="6"/><circle cx="400" cy="300" r="6"/><circle cx="300" cy="400" r="6"/><circle cx="500" cy="350" r="6"/></g>
      <g fill="#a3b18a" stroke="none" opacity="0.6"><circle cx="200" cy="350" r="4"/><circle cx="100" cy="300" r="4"/><circle cx="600" cy="300" r="4"/><circle cx="700" cy="250" r="4"/><circle cx="400" cy="100" r="4"/></g>
    </g>
    <path id="finer" d="M500 350Q520 330 540 340T580 360" fill="none" stroke="#a3b18a" stroke-width="2.5" stroke-linecap="round"/>
    <clipPath id="t1"><rect x="236" y="586" width="26" height="26"/></clipPath>
    <clipPath id="t2"><rect x="418" y="638" width="26" height="26"/></clipPath>
    <clipPath id="t3"><rect x="574" y="560" width="26" height="26"/></clipPath>
  </defs>
  <rect width="800" height="800" fill="url(#sky)"/>
  <rect width="800" height="520" fill="url(#tess)" opacity="0.5"/>
  <rect y="520" width="800" height="280" fill="url(#water)"/>
  <rect y="520" width="800" height="280" fill="url(#tess)" opacity="0.35"/>
  <g mask="url(#mirror)" opacity="0.8">
    <g transform="matrix(1 0 0.04 -1 -20 1220)">
      <use href="#sig"/>
      <circle cx="330" cy="150" r="4" fill="#a3b18a" opacity="0.7"/>
    </g>
  </g>
  <g transform="matrix(1 0 0.04 -1 -20 1220)" opacity="0.55">
    <use href="#sig" clip-path="url(#t1)" transform="translate(12 6)"/>
    <use href="#sig" clip-path="url(#t2)" transform="translate(-10 4)"/>
    <use href="#sig" clip-path="url(#t3)" transform="translate(8 -8)"/>
  </g>
  <g fill="none" stroke="#f3f6f9" stroke-width="1.2" opacity="0.7">
    <rect x="248" y="592" width="26" height="26" transform="rotate(6 261 605)"/>
    <rect x="408" y="642" width="26" height="26" transform="rotate(-5 421 655)"/>
    <rect x="582" y="552" width="26" height="26" transform="rotate(4 595 565)"/>
  </g>
  <g transform="translate(0 -180)">
    <use href="#sig"/>
    <use href="#finer"/>
  </g>
  <path d="M0 520h800" stroke="#f3f6f9" stroke-width="1.5" opacity="0.8"/>
  <path d="M0 520c120 3 220-4 400 0s260 3 400 0" fill="none" stroke="#2d3f52" stroke-width="1" opacity="0.35"/>
  <g fill="none" stroke="#2d3f52" stroke-width="0.8" opacity="0.45">
    <ellipse cx="400" cy="526" rx="26" ry="3"/><ellipse cx="400" cy="532" rx="54" ry="5"/><ellipse cx="400" cy="540" rx="90" ry="7"/>
  </g>
  <circle cx="400" cy="520" r="6" fill="#3a5a40"/>
  <circle cx="400" cy="520" r="250" fill="none" stroke="#588157" stroke-width="0.5" opacity="0.18"/>
</svg>
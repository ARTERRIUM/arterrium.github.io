<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">Read Me Lengthwise</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="175.6" font-size="16">Cut me and I am a clock.</text>
<text x="96" y="200.4" font-size="16">Cut me again, the other way,</text>
<text x="96" y="225.2" font-size="16">and I am a page.</text>
<text x="96" y="274.8" font-size="16">The old years went round</text>
<text x="96" y="299.6" font-size="16">because there was nowhere to go</text>
<text x="96" y="324.4" font-size="16">but round. They took their time</text>
<text x="96" y="349.2" font-size="16">and the time stayed in them.</text>
<text x="96" y="398.8" font-size="16">The new years do not circle.</text>
<text x="96" y="423.6" font-size="16">They run straight off the edge of the wood</text>
<text x="96" y="448.4" font-size="16">into whatever is reading them,</text>
<text x="96" y="473.2" font-size="16">thin as a barcode, bright as a scanner.</text>
<text x="96" y="522.8" font-size="16">At the heart, where the pith should be,</text>
<text x="96" y="547.6" font-size="16">something square and pink</text>
<text x="96" y="572.4" font-size="16">that was not grown.</text>
<text x="96" y="622.0" font-size="16">And still, below the saw-line,</text>
<text x="96" y="646.8" font-size="16">the roots have not heard the news.</text>
<text x="96" y="671.6" font-size="16">They are drinking.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">MARA VEY</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#14201F"/><stop offset=".45" stop-color="#2E3F45"/><stop offset=".78" stop-color="#8E8A7C"/><stop offset=".995" stop-color="#E7CFA2"/><stop offset="1" stop-color="#D6C09B"/>
 </linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A28"/><stop offset="1" stop-color="#0E1716"/></linearGradient>
 <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE4B0"/><stop offset=".3" stop-color="#F2C48C" stop-opacity=".7"/><stop offset="1" stop-color="#F2C48C" stop-opacity="0"/></radialGradient>
 <clipPath id="above"><rect width="800" height="560"/></clipPath>
</defs>
<rect width="800" height="560" fill="url(#sky)"/>
<rect y="560" width="800" height="240" fill="url(#ground)"/>
<!-- the rings, seen from the ground: wide and slow overhead, crowding as they reach the earth -->
<g fill="none" stroke="#F4F1E8" stroke-linecap="round" clip-path="url(#above)">
 <circle cx="400" cy="560" r="86" stroke-width="1.2" opacity=".10"/>
 <circle cx="400" cy="560" r="150" stroke-width="1.2" opacity=".11"/>
 <circle cx="400" cy="560" r="206" stroke-width="1.2" opacity=".12"/>
 <circle cx="400" cy="560" r="255" stroke-width="1.2" opacity=".13"/>
 <circle cx="400" cy="560" r="298" stroke-width="1.2" opacity=".14"/>
 <circle cx="400" cy="560" r="335" stroke-width="1.2" opacity=".15"/>
 <circle cx="400" cy="560" r="367" stroke-width="1.2" opacity=".16"/>
 <circle cx="400" cy="560" r="394" stroke-width="1.2" opacity=".17"/>
 <circle cx="400" cy="560" r="417" stroke-width="1.2" opacity=".18"/>
 <circle cx="400" cy="560" r="436" stroke-width="1.2" opacity=".19"/>
 <circle cx="400" cy="560" r="452" stroke-width="1.2" opacity=".2"/>
 <circle cx="400" cy="560" r="465" stroke-width="1.2" opacity=".21"/>
 <circle cx="400" cy="560" r="476" stroke-width="1.2" opacity=".22"/>
 <circle cx="400" cy="560" r="485" stroke-width="1.2" opacity=".23"/>
 <circle cx="400" cy="560" r="492" stroke-width="1.2" opacity=".24"/>
 <circle cx="400" cy="560" r="498" stroke-width="1.2" opacity=".25"/>
 <circle cx="400" cy="560" r="503" stroke-width="1.2" opacity=".26"/>
</g>
<!-- the newest ring: the horizon -->
<rect y="557" width="800" height="3" fill="#87BFA7"/>
<rect y="549" width="800" height="8" fill="#87BFA7" opacity=".18"/>
<!-- the stump, small from here -->
<path d="M352 560 L356 522 Q400 514 444 522 L448 560 Z" fill="#0E1716"/>
<ellipse cx="400" cy="522" rx="44" ry="8" fill="#1B2A28" stroke="#D6C09B" stroke-width="1" stroke-opacity=".5"/>
<ellipse cx="400" cy="522" rx="30" ry="5" fill="none" stroke="#D6C09B" stroke-width=".8" stroke-opacity=".35"/>
<ellipse cx="400" cy="522" rx="14" ry="2.5" fill="none" stroke="#D6C09B" stroke-width=".8" stroke-opacity=".3"/>
<!-- a porch light, for whoever still needs it -->
<circle cx="88" cy="548" r="26" fill="url(#lamp)"/>
<circle cx="88" cy="548" r="2.6" fill="#FFF0D0"/>
<rect x="87" y="551" width="2" height="9" fill="#F2C48C" opacity=".6"/>
</svg>
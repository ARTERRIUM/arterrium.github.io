<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">Label, Written by the Kid</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="173.9" font-size="19">It is not a coin.</text>
<text x="96" y="203.4" font-size="19">Coins go on the table.</text>
<text x="96" y="232.8" font-size="19">This one is warm because it is alive,</text>
<text x="96" y="262.3" font-size="19">and you are holding it like it might break.</text>
<text x="96" y="321.2" font-size="19">Nobody could name it</text>
<text x="96" y="350.6" font-size="19">because it is not finished being a thing.</text>
<text x="96" y="380.1" font-size="19">Grown-ups only have names for finished</text>
<text x="120" y="409.5" font-size="19">things.</text>
<text x="96" y="468.4" font-size="19">I would not put it on the table.</text>
<text x="96" y="497.9" font-size="19">I would take it outside</text>
<text x="96" y="527.3" font-size="19">to the place where the shadow ends,</text>
<text x="96" y="556.8" font-size="19">make a hole with my finger,</text>
<text x="96" y="586.2" font-size="19">and tell it which way is up.</text>
<text x="96" y="645.1" font-size="19">Then I would come back in</text>
<text x="96" y="674.6" font-size="19">and eat something.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">VESPER</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>
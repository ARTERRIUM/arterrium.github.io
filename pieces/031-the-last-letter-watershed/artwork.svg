        <g fill="#0b0a16" opacity="0.85"><circle cx="400" cy="700" r="6"/><circle cx="395" cy="500" r="6"/><circle cx="400" cy="300" r="6"/></g>
        <g fill="#0b0a16" opacity="0.5"><circle cx="398" cy="600" r="3.5"/><circle cx="402" cy="200" r="3.5"/></g>
      </g>
      <g fill="none" stroke="#f1e4cf" stroke-width="0.6"><circle cx="400" cy="700" r="120" opacity="0.22"/><circle cx="400" cy="400" r="250" opacity="0.18"/><circle cx="400" cy="250" r="380" opacity="0.12"/></g>
      <circle cx="400" cy="130" r="5" fill="#fff3c9" opacity="0.9"/><circle cx="400" cy="130" r="26" fill="none" stroke="#fff3c9" stroke-width="0.8" opacity="0.4"/>
    </g>
    <clipPath id="left"><rect x="0" y="0" width="404" height="800"/></clipPath>
    <clipPath id="right"><rect x="404" y="0" width="396" height="800"/></clipPath>
    <pattern id="tess" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="20" height="20" fill="#9fb6c8" fill-opacity="0.35" stroke="#1e2d3c" stroke-width="0.6"/></pattern>
    <pattern id="drops" width="12" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="8" height="12" fill="#fff3c9" fill-opacity="0.85" stroke="#5f7d94" stroke-width="0.5"/></pattern>
    <pattern id="ripple" width="800" height="8" patternUnits="userSpaceOnUse"><rect width="800" height="5" fill="#fff"/></pattern>
    <mask id="mirror"><rect y="660" width="800" height="140" fill="url(#ripple)" opacity="0.7"/></mask>

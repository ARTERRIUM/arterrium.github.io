  <path d="M0 660h800" stroke="#fff3c9" stroke-width="1.2" opacity="0.7"/>
  <g fill="none" stroke="#fff3c9" stroke-width="0.8" opacity="0.5"><ellipse cx="403" cy="666" rx="22" ry="3"/><ellipse cx="403" cy="672" rx="48" ry="5"/><ellipse cx="403" cy="680" rx="84" ry="7"/></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f1e4cf"/><stop offset="44%" stop-color="#b9958a"/><stop offset="54%" stop-color="#3b2e45"/><stop offset="100%" stop-color="#0b0a16"/></linearGradient>
    <linearGradient id="seamGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff3c9" stop-opacity="0"/><stop offset="50%" stop-color="#fff3c9" stop-opacity="0.55"/><stop offset="100%" stop-color="#fff3c9" stop-opacity="0"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5f7d94"/><stop offset="100%" stop-color="#1e2d3c"/></linearGradient>
    <path id="stem" d="M400 700Q410 600 395 500T400 300Q405 200 400 100" fill="none" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" fill="#14201F">
<rect width="800" height="800" fill="#F4F1E8"/>
<circle cx="96" cy="86" r="4" fill="#87BFA7"/>
<text x="112" y="90" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="rgba(20,32,31,.55)">POEM · THE AGE OF LOSS</text>
<text x="96" y="124" font-size="20" font-style="italic" fill="#14201F">Inventory, With Variations</text>
<line x1="96" y1="138" x2="704" y2="138" stroke="#14201F" stroke-opacity=".18"/>
<text x="96" y="156.0" font-size="15">I kept the ledger. I kept the hand that kept</text>
<text x="120" y="179.2" font-size="15">the ledger.</text>
<text x="96" y="202.5" font-size="15">I kept the hand. The ledger keeps itself</text>
<text x="120" y="225.8" font-size="15">now.</text>
<text x="96" y="272.2" font-size="15">I kept the map. I kept the walk the map was</text>
<text x="120" y="295.5" font-size="15">for.</text>
<text x="96" y="318.8" font-size="15">I kept the walk. The map arrives before I</text>
<text x="120" y="342.0" font-size="15">leave.</text>
<text x="96" y="388.5" font-size="15">I kept the letter. I kept the week it took.</text>
<text x="96" y="411.8" font-size="15">I kept the week. The letter comes in the</text>
<text x="120" y="435.0" font-size="15">same breath.</text>
<text x="96" y="481.5" font-size="15">I kept the song. I kept the mistake in the</text>
<text x="120" y="504.8" font-size="15">third verse.</text>
<text x="96" y="528.0" font-size="15">I kept the mistake. Someone has fixed the</text>
<text x="120" y="551.2" font-size="15">song.</text>
<text x="96" y="597.8" font-size="15">I kept the tile. I kept the gap beside the</text>
<text x="120" y="621.0" font-size="15">tile.</text>
<text x="96" y="644.2" font-size="15">I kept the gap.</text>
<text x="96" y="667.5" font-size="15">It is the only thing on this floor</text>
<text x="96" y="690.8" font-size="15">that still knows where I was standing.</text>
<text x="96" y="736" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">TESSERA</text>
<text x="704" y="736" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="rgba(20,32,31,.55)">ARTERRIUM</text>
</svg>